<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>一家倖存 · Family Survivors v0.02206</title>
  <link rel="stylesheet" href="css/style.css?v=02206" />
</head>
<body>
  <!-- 街機選角 -->
  <div id="screen-select" class="screen">
    <div class="arcade-frame">
      <h1 class="title-pixel">一家倖存</h1>
      <div class="ver-title">v0.02206</div>
      <p class="subtitle">5:00 · TAG · 轉職</p>

      <div class="players-stack">
        <div class="player-panel" id="panel-p1">
          <div class="panel-label">1P <span class="hint">A／D · Space</span></div>
          <div class="carousel" id="carousel-p1" data-player="1">
            <button type="button" class="carousel-chev" data-player="1" data-dir="-1" aria-label="上一個">◀</button>
            <div class="carousel-stage" id="cards-p1"></div>
            <button type="button" class="carousel-chev" data-player="1" data-dir="1" aria-label="下一個">▶</button>
          </div>
          <div class="carousel-meta">
            <div class="ready-tag" id="ready-p1">未</div>
            <button type="button" class="btn-confirm" id="btn-confirm-p1">定</button>
          </div>
        </div>
        <div class="player-panel" id="panel-p2">
          <div class="panel-label">2P <span class="hint">←／→ · Enter（可選）</span></div>
          <div class="carousel" id="carousel-p2" data-player="2">
            <button type="button" class="carousel-chev" data-player="2" data-dir="-1" aria-label="上一個">◀</button>
            <div class="carousel-stage" id="cards-p2"></div>
            <button type="button" class="carousel-chev" data-player="2" data-dir="1" aria-label="下一個">▶</button>
          </div>
          <div class="carousel-meta">
            <div class="ready-tag" id="ready-p2">未加</div>
            <button type="button" class="btn-confirm" id="btn-confirm-p2">加</button>
          </div>
        </div>
      </div>

      <div id="select-sticks" class="select-sticks" aria-hidden="true">
        <div class="select-stick" id="select-stick-p1" data-player="1">
          <div class="select-stick-pad">
            <div class="select-stick-base"></div>
            <div class="select-stick-knob"></div>
          </div>
          <div class="select-stick-label">1P</div>
        </div>
        <div class="select-stick" id="select-stick-p2" data-player="2">
          <div class="select-stick-pad">
            <div class="select-stick-base"></div>
            <div class="select-stick-knob"></div>
          </div>
          <div class="select-stick-label">2P</div>
        </div>
      </div>

      <div class="select-footer">
        <button id="btn-start" class="btn-arcade" disabled>開打</button>
        <p class="footer-note">1P 必 · 2P 可 · H／0 招 · 打橫玩</p>
      </div>
    </div>
  </div>

  <!-- 遊戲中 -->
  <div id="screen-game" class="screen hidden">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="hud-left">
        <div id="auto-btns" class="auto-btns"></div>
        <div id="timer">5:00</div>
        <div id="kill-count">殺 0</div>
        <button type="button" id="hud-zoom" class="fx-chip zoom-chip" title="畫面倍率 1／1.5／2／3">1</button>
        <button type="button" id="hud-fx" class="fx-chip" title="特效">效</button>
      </div>
      <div class="hud-center">
        <div id="xp-bar-wrap"><div id="xp-bar"></div></div>
        <div id="level-label">Lv.1</div>
      </div>
      <div class="hud-right">
        <div id="hp-p1" class="hp-chip"></div>
        <div id="hp-p2" class="hp-chip hidden"></div>
      </div>
    </div>
    <div id="ult-btns" class="ult-btns" aria-label="招">
      <button type="button" id="btn-ult-p1" class="ult-btn" aria-label="1P招">招</button>
      <button type="button" id="btn-ult-p2" class="ult-btn hidden" aria-label="2P招">招</button>
    </div>
    <div id="ver-hud" class="ver-hud">v0.02206</div>
    <div id="pause-hint">Esc</div>
  </div>

  <div id="rotateModal" role="dialog" aria-modal="true" aria-labelledby="rotateTitle">
    <div class="card">
      <div class="icon" aria-hidden="true">📱↔️</div>
      <h2 id="rotateTitle">打橫</h2>
      <p>打橫先玩</p>
    </div>
  </div>
  <button type="button" id="fsBtn" aria-label="全螢幕">全</button>
  <div id="fsFailTip">呢個瀏覽器唔支援全螢幕。請用 Safari 右下「⋯」→用 Safari 開啟，再打橫。</div>

  <!-- 升級選技／轉職 -->
  <div id="overlay-levelup" class="overlay hidden">
    <div class="overlay-box wide">
      <h2 id="levelup-title">選</h2>
      <p id="levelup-sub" class="levelup-sub">剩餘點數：3</p>
      <p id="active-tags" class="active-tags"></p>
      <div id="upgrade-choices" class="upgrade-row"></div>
      <p class="pick-hint">1／2／3</p>
    </div>
  </div>

  <!-- 暫停 + 特效設定 -->
  <div id="overlay-pause" class="overlay hidden">
    <div class="overlay-box wide">
      <h2>停</h2>
      <div class="fx-panel">
        <div class="fx-label">效</div>
        <div class="fx-row">
          <button type="button" class="fx-btn" data-fx="full">完整</button>
          <button type="button" class="fx-btn" data-fx="simple">簡約</button>
          <button type="button" class="fx-btn" data-fx="off">關閉</button>
        </div>
        <p class="fx-note">記本機</p>
      </div>
      <div class="fx-label">技</div>
      <div id="pause-players" class="pause-players"></div>
      <button class="btn-arcade" id="btn-resume">續</button>
      <button class="btn-arcade btn-dim" id="btn-quit">返</button>
    </div>
  </div>

  <!-- 勝負 -->
  <div id="overlay-end" class="overlay hidden">
    <div class="overlay-box">
      <h2 id="end-title">勝利</h2>
      <p id="end-stats"></p>
      <button class="btn-arcade" id="btn-again">再</button>
      <button class="btn-arcade btn-dim" id="btn-to-select">返</button>
    </div>
  </div>

  <script src="js/characters/spriteUtil.js?v=02206"></script>
  <script src="js/characters/daughter.js?v=02206"></script>
  <script src="js/characters/dad.js?v=02206"></script>
  <script src="js/data/sprites.js?v=02206"></script>
  <script src="js/data/characters.js?v=02206"></script>
  <script src="js/data/skills.js?v=02206"></script>
  <script src="js/data/upgrades.js?v=02206"></script>
  <script src="js/data/branches.js?v=02206"></script>
  <script src="js/core/config.js?v=02206"></script>
  <script src="js/core/dom.js?v=02206"></script>
  <script src="js/core/trees.js?v=02206"></script>
  <script src="js/core/input.js?v=02206"></script>
  <script src="js/core/mobile.js?v=02206"></script>
  <script src="js/ui/menus.js?v=02206"></script>
  <script src="js/core/player.js?v=02206"></script>
  <script src="js/core/fx.js?v=02206"></script>
  <script src="js/combat/combat.js?v=02206"></script>
  <script src="js/core/levelup.js?v=02206"></script>
  <script src="js/enemies/enemyTiers.js?v=02206"></script>
  <script src="js/enemies/enemies.js?v=02206"></script>
  <script src="js/core/loop.js?v=02206"></script>
  <script src="js/combat/weapons.js?v=02206"></script>
  <script src="js/core/world.js?v=02206"></script>
  <script src="js/ui/hud.js?v=02206"></script>
  <script src="js/render/draw.js?v=02206"></script>
  <script src="js/skills/skillEffects.js?v=02206"></script>
  <script src="js/enemies/spawnPatterns.js?v=02206"></script>
  <script src="js/render/drawExtras.js?v=02206"></script>
  <script src="js/ui/pause.js?v=02206"></script>
  <script src="js/branches/branchCore.js?v=02206"></script>
  <script src="js/branches/daughter.js?v=02206"></script>
  <script src="js/branches/dad.js?v=02206"></script>
  <script src="js/enemies/enemyAI.js?v=02206"></script>
  <script src="js/render/branchDraw.js?v=02206"></script>
  <script src="js/main.js?v=02206"></script>
</body>
</html>
